<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dsh-free-api 管理面板</title>
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--border:#2a2f3a;--text:#e6e9ef;--muted:#8b93a5;
  --accent:#4f8cff;--green:#3ecf8e;--red:#ff6b6b;--yellow:#f5c451;--purple:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
a{color:var(--accent);text-decoration:none}
#login{max-width:360px;margin:15vh auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:32px}
#login h1{font-size:18px;margin-bottom:4px}
#login p{color:var(--muted);margin-bottom:20px;font-size:13px}
input,select,textarea{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;width:100%;font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font:inherit}
button:hover{filter:brightness(1.1)}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
button.danger{background:var(--red)}
button.small{padding:4px 10px;font-size:12px;border-radius:6px}
#app{display:flex;min-height:100vh}
nav{width:200px;background:var(--panel);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0}
nav .logo{padding:0 20px 16px;font-weight:700;font-size:15px;border-bottom:1px solid var(--border);margin-bottom:8px}
nav a{display:block;padding:9px 20px;color:var(--muted);cursor:pointer}
nav a.active{color:var(--text);background:var(--panel2);border-left:3px solid var(--accent)}
main{flex:1;padding:24px;max-width:1200px}
h2{font-size:17px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--muted);text-align:left;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px}
.badge.green{background:rgba(62,207,142,.15);color:var(--green)}
.badge.red{background:rgba(255,107,107,.15);color:var(--red)}
.badge.yellow{background:rgba(245,196,81,.15);color:var(--yellow)}
.badge.gray{background:rgba(139,147,165,.15);color:var(--muted)}
.badge.blue{background:rgba(79,140,255,.15);color:var(--accent)}
.badge.purple{background:rgba(167,139,250,.15);color:var(--purple)}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{width:auto}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 18px}
.stat .v{font-size:22px;font-weight:700;margin-top:2px}
.stat .l{color:var(--muted);font-size:12px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:520px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin-bottom:16px;font-size:15px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center}
.spacer{flex:1}
.muted{color:var(--muted);font-size:12px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
pre{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px;overflow:auto;font-size:12px;max-height:400px}
.toast{position:fixed;top:16px;right:16px;background:var(--panel2);border:1px solid var(--border);padding:10px 18px;border-radius:8px;z-index:99;display:none}
.toast.err{border-color:var(--red);color:var(--red)}
.searchbox{min-width:200px}
.switch{position:relative;width:34px;height:18px;background:var(--border);border-radius:10px;cursor:pointer;transition:.2s;flex-shrink:0}
.switch.on{background:var(--green)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:.2s}
.switch.on::after{left:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.pager{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.tabs a{padding:8px 14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs a.active{color:var(--text);border-bottom-color:var(--accent)}
</style>
</head>
<body>
<div id="login" style="display:none">
  <h1>dsh-free-api</h1>
  <p>多平台 AI 代理网关 · 管理面板</p>
  <input type="password" id="pw" placeholder="管理密码" onkeydown="if(event.key==='Enter')doLogin()">
  <button style="width:100%;margin-top:12px" onclick="doLogin()">登录</button>
</div>
<div id="app" style="display:none">
  <nav>
    <div class="logo">🛰 dsh-free-api</div>
    <a data-page="dashboard">仪表盘</a>
    <a data-page="platforms">平台</a>
    <a data-page="accounts">平台账号</a>
    <a data-page="models">模型管理</a>
    <a data-page="virtual">统一模型</a>
    <a data-page="apikeys">API Keys</a>
    <a data-page="usage">用量日志</a>
    <a data-page="mcp">MCP 服务</a>
    <a data-page="playground">测试台</a>
    <a data-page="settings">设置</a>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
